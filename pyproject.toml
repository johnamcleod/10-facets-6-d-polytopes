[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "coxeter-6polytopes"
version = "0.1.0"
description = "Classification of compact hyperbolic Coxeter 6-polytopes with 10 facets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "networkx>=3.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-xdist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
